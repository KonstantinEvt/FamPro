        body {

        .preloader {

            top: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            /* фоновый цвет */
            background: #e0e0e0;
            z-index: 1001;
        }

        .preloader__image {
            position: relative;
            top: 50%;
            left: 50%;
            width: 70px;
            height: 70px;
            margin-top: -35px;
            margin-left: -35px;
            text-align: center;
            animation: preloader-rotate 2s infinite linear;
        }

        @keyframes preloader-rotate {
            100% {
                transform: rotate(360deg);
            }
        }

        .loaded_hiding .preloader {
            transition: 0.3s opacity;
            opacity: 0;
        }

        .loaded .preloader {
            display: none;

<script>
    window.onload = function () {
        document.body.classList.add('loaded_hiding');
        window.setTimeout(function () {
            document.body.classList.add('loaded');
            document.body.classList.remove('loaded_hiding');
        }, 500);
    }
</script>
<script>
    const langRu = new Map([
        ['langButton', '&nbsp;&#x1F1F7;&#x1F1FA;&nbsp;'],
        ['mainTitle', 'Мемман'],
        ['postAnn', 'Предки следят за тобой'],
        ['langTabLabel', 'Язык'],
        ['selectLang', 'Выбрать'],
        ['serviceButton', 'Служба'],
        ['aboutButton', 'О&nbsp;проекте'],
        ['workingStatus', 'Мы извиняемся'],
        ['workingStatusText', 'Сайт временно недоступен - идут работы'],
        ['manButton', 'Человек'],
        ['preAnn', 'Дерево без корней - дрова'],
        ['onWork', 'Данный контент находится в разработке'],
        ['secondaryTitle', 'Родовая память']
    ]);
    const langEn = new Map([
        ['langButton', '&nbsp;&#x1F1FA;&#x1F1F8;&nbsp;'],
        ['mainTitle', 'Memman'],
        ['postAnn', 'The ancestors are watching you'],
        ['langTabLabel', 'Languish'],
        ['selectLang', 'Select'],
        ['serviceButton', 'Service'],
        ['aboutButton', 'About'],
        ['workingStatus', 'We are sorry'],
        ['workingStatusText', 'The site is temporarily unavailable - work is underway'],
        ['manButton', 'Man'],
        ['preAnn', 'A tree without roots - firewood'],
        ['onWork', 'This content is under development.'],
        ['secondaryTitle', 'Memory of Mankind']
    ]);
    let currentLang = (localStorage.getItem(`currentLang`)===null)?"ru":localStorage.getItem('currentLang');
    localStorage.setItem('callbackPage', '/free/page/front');
    document.getElementById(`${currentLang}Loc`).checked=true;
    function changeLang(lang) {
        let langMatrix;
        currentLang=lang;
        if (currentLang === 'ru') {
            langMatrix = langRu;}
        else {langMatrix = langEn;}
        for (let langElement of langMatrix.keys()) {
            if (document.getElementById(langElement)!==undefined&&document.getElementById(langElement)!==null) document.getElementById(langElement).innerHTML = langMatrix.get(langElement);
        }
        localStorage.setItem('currentLang', currentLang);
        document.getElementById(`${currentLang}Loc`).checked=true;
    }
    function changeLangMenu(lang) {
        if (lang === 'ru') { document.getElementById('langTabLabel').innerHTML = langRu.get('langTabLabel');
            document.getElementById('selectLang').innerHTML = langRu.get('selectLang');
            }
        else {document.getElementById('langTabLabel').innerHTML = langEn.get('langTabLabel');
            document.getElementById('selectLang').innerHTML = langEn.get('selectLang');
            }
    }
    changeLang(currentLang);
</script>
