<style>
body {
margin: 0;
}

.preloader {
position: fixed;
left: 0;
top: 0;
right: 0;
bottom: 0;
overflow: hidden;
/* фоновый цвет */
background: #e0e0e0;
z-index: 1001;
}

.preloader__image {
position: relative;
top: 50%;
left: 50%;
width: 70px;
height: 70px;
margin-top: -35px;
margin-left: -35px;
text-align: center;
animation: preloader-rotate 2s infinite linear;
}

@keyframes preloader-rotate {
100% {
transform: rotate(360deg);
}
}

.loaded_hiding .preloader {
transition: 0.3s opacity;
opacity: 0;
}

.loaded .preloader {
display: none;
}
</style>

</head>

<div class="offcanvas offcanvas-end" data-bs-scroll="true" tabindex="-1" id="langTab" style="width: 150px"
     aria-labelledby="langTab">

    <div class="offcanvas-body" id="locForm">

            </div>
            <br>
            <div>
                <input type="radio" id="enLoc" name="loc" value="en"/>
                <label for="enLoc">English </label>
            </div>
            <div>

<script>

    window.onload = function () {
        document.body.classList.add('loaded_hiding');
